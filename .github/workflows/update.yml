name: 每日更新片單

on:
  schedule:
    # 每天台灣時間 04:17（GitHub 排程用 UTC，20:17 UTC = 台灣 04:17）
    - cron: '17 20 * * *'
  workflow_dispatch: {}   # 也可以在 Actions 頁面手動按「Run workflow」

permissions:
  contents: write

concurrency:
  group: update-films
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 讀 Letterboxd RSS 並更新 films.json
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          LB_USER: twohundredlee
        run: python3 scripts/update.py

      - name: 有變動就存回 GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add films.json data/seen.json
          if git diff --cached --quiet; then
            echo "沒有變動"
          else
            git commit -m "自動更新片單 $(TZ=Asia/Taipei date +%F)"
            git push
          fi
